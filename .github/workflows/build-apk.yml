name: Build RunTrack Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Verify Gradle wrapper JAR checksum
        run: |
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Prepare diagnostic logs
        run: mkdir -p ci-logs

      - name: Generate offline Russian voice assets
        id: voice
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          (
            set -euo pipefail
            VOICE_DIR="$RUNNER_TEMP/runtrack-piper"
            MODEL_BASE="https://huggingface.co/rhasspy/piper-voices/resolve/a31bce3ed50c05399b2a830efd1c607df03cf4b5/ru/ru_RU/dmitri/medium"
            mkdir -p "$VOICE_DIR"

            python3 -m pip install               --disable-pip-version-check               --no-cache-dir               "piper-tts==1.4.2"

            curl --fail --location --retry 4 --retry-all-errors               -o "$VOICE_DIR/ru_RU-dmitri-medium.onnx"               "$MODEL_BASE/ru_RU-dmitri-medium.onnx?download=true"
            echo "f073356ebc4bd0f80c5af58df2953a5988bd5bdab1eb38635ce960b071fbefcb  $VOICE_DIR/ru_RU-dmitri-medium.onnx" | sha256sum -c -

            curl --fail --location --retry 4 --retry-all-errors               -o "$VOICE_DIR/ru_RU-dmitri-medium.onnx.json"               "$MODEL_BASE/ru_RU-dmitri-medium.onnx.json?download=true"

            python3 tools/generate_voice_assets.py               --model "$VOICE_DIR/ru_RU-dmitri-medium.onnx"               --config "$VOICE_DIR/ru_RU-dmitri-medium.onnx.json"               --output app/src/main/assets/voice_ru
          ) 2>&1 | tee ci-logs/00-voice-assets.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 1. Основной Kotlin-код
      # -------------------------------------------------
      - name: Main Kotlin compile
        id: compile
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --continue --console=plain \
            :app:compileDebugKotlin \
            2>&1 | tee ci-logs/01-main-kotlin-compile.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 2. Unit tests
      # -------------------------------------------------
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --continue --console=plain \
            :app:testDebugUnitTest \
            2>&1 | tee ci-logs/02-unit-tests.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 3. Android tests compile
      # -------------------------------------------------
      - name: Compile Android tests
        id: android_tests
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --continue --console=plain \
            :app:compileDebugAndroidTestKotlin \
            2>&1 | tee ci-logs/03-android-tests.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 4. FULL LINT
      # -------------------------------------------------
      - name: Android lint - FULL REPORT
        id: lint
        continue-on-error: true
        run: |
          set +e

          ./gradlew --no-daemon --continue --console=plain \
            :app:lintDebug \
            2>&1 | tee ci-logs/04-lint-gradle.log

          CODE=${PIPESTATUS[0]}

          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"

          echo
          echo "============================================================"
          echo "FULL ANDROID LINT REPORT"
          echo "============================================================"

          if [ -f "$REPORT" ]; then
            cp "$REPORT" ci-logs/05-lint-full-report.txt
            cat "$REPORT"
          else
            echo "Lint text report was not generated."
          fi

          echo
          echo "Lint exit code: $CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 5. Всё равно пытаемся собрать APK,
      # даже если lint/tests уже красные
      # -------------------------------------------------
      - name: Build debug APK
        id: apk
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --continue --console=plain \
            :app:assembleDebug \
            2>&1 | tee ci-logs/06-assemble-debug.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      - name: Build release APK
        id: release_apk
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --continue --console=plain             :app:assembleRelease             2>&1 | tee ci-logs/06b-assemble-release.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      - name: Verify Room schema history
        id: room_schema
        continue-on-error: true
        run: |
          set +e
          SCHEMA_DIR="app/schemas/com.runtrack.app.data.RunTrackDatabase"
          test -s "$SCHEMA_DIR/3.json" && test -s "$SCHEMA_DIR/4.json"
          CODE=$?
          if [ "$CODE" -eq 0 ]; then
            # compileDebugKotlin ran KSP earlier. A diff means committed v4 is stale.
            git diff --exit-code -- "$SCHEMA_DIR/4.json" || CODE=$?
          fi
          if [ "$CODE" -ne 0 ]; then
            echo "Room schema history missing or stale" | tee ci-logs/06c-room-schema.log
          else
            echo "Room schema history present and current v4 matches KSP" | tee ci-logs/06c-room-schema.log
          fi
          exit "$CODE"

      - name: Verify legacy prototype resources are absent
        id: packaging
        continue-on-error: true
        run: |
          set +e
          unzip -l app/build/outputs/apk/debug/app-debug.apk > ci-logs/06d-apk-contents.txt
          if grep -E 'screen_[0-9]{2}_.*\.png' ci-logs/06d-apk-contents.txt; then
            echo "Legacy prototype screen PNGs are still packaged" | tee ci-logs/06d-packaging.log
            exit 1
          fi
          python3 - <<'PY' | tee ci-logs/06d-packaging.log
          from pathlib import Path
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          print(f"debug APK bytes={apk.stat().st_size}")
          PY

      - name: Verify offline voice package
        id: voice_apk
        continue-on-error: true
        run: |
          set +e
          python3 tools/generate_voice_assets.py             --verify-apk app/build/outputs/apk/debug/app-debug.apk             2>&1 | tee ci-logs/07-voice-apk.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 6. Реальный запуск APK на Android Emulator.
      # Ловит startup/runtime crashes, которые assembleDebug не видит.
      # -------------------------------------------------
      - name: Prepare Android AVD home
        id: avd_home
        continue-on-error: true
        run: |
          set -euo pipefail

          AVD_HOME="$HOME/.android/avd"

          mkdir -p "$AVD_HOME"

          chmod 700 "$HOME/.android"
          chmod 700 "$AVD_HOME"

          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"

          echo "============================================================"
          echo "ANDROID AVD HOME"
          echo "============================================================"
          echo "HOME=$HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME"

          test -d "$AVD_HOME"

          ls -ld "$HOME/.android"
          ls -ld "$AVD_HOME"
      - name: Enable KVM for Android Emulator
        id: kvm
        continue-on-error: true
        run: |
          set -e
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Runtime startup smoke test
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: runtrack-ci
          force-avd-creation: true
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -no-snapshot-save
          script: bash .github/scripts/runtime-smoke.sh
      # -------------------------------------------------
      # Краткая выборка всех Error/Exception
      # -------------------------------------------------
      - name: Collect error summary
        if: always()
        run: |
          {
            echo "============================================================"
            echo "RUNTRACK ERROR SUMMARY"
            echo "============================================================"
            echo

            grep --exclude='00-error-summary.txt' -RniE \
              '(^|[[:space:]])(e:|error:|Error:|FAILURE:|Exception|Caused by:|FAILED)' \
              ci-logs \
              || true
          } | tee ci-logs/00-error-summary.txt

      # -------------------------------------------------
      # Все диагностические материалы сохраняются
      # даже при красной сборке
      # -------------------------------------------------
      - name: Upload full diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RunTrack-full-diagnostics
          path: |
            ci-logs/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/schemas/**/*.json
          if-no-files-found: warn

      # Если APK реально построился — отдельный удобный artifact
      - name: Upload APK
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RunTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: always() && steps.release_apk.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RunTrack-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      # -------------------------------------------------
      # Финальный статус. Только здесь CI окончательно падает.
      # -------------------------------------------------
      - name: Final CI gate
        if: always()
        run: |
          echo "========================================"
          echo "RUNTRACK FINAL STATUS"
          echo "========================================"
          echo "Voice assets:   ${{ steps.voice.outcome }}"
          echo "Main compile:   ${{ steps.compile.outcome }}"
          echo "Unit tests:     ${{ steps.unit.outcome }}"
          echo "Android tests:  ${{ steps.android_tests.outcome }}"
          echo "Lint:           ${{ steps.lint.outcome }}"
          echo "APK build:      ${{ steps.apk.outcome }}"
          echo "Release build:  ${{ steps.release_apk.outcome }}"
          echo "Room schemas:   ${{ steps.room_schema.outcome }}"
          echo "Packaging:      ${{ steps.packaging.outcome }}"
          echo "Voice in APK:   ${{ steps.voice_apk.outcome }}"
          echo "AVD home:       ${{ steps.avd_home.outcome }}"
          echo "KVM setup:      ${{ steps.kvm.outcome }}"
          echo "Runtime smoke:  ${{ steps.smoke.outcome }}"
          echo "========================================"

          FAILED=0

          [ "${{ steps.voice.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.compile.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.unit.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.android_tests.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.lint.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.apk.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.release_apk.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.room_schema.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.packaging.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.voice_apk.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.avd_home.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.kvm.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.smoke.outcome }}" = "success" ] || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ Есть ошибки. Смотри RunTrack-full-diagnostics."
            exit 1
          fi

          echo "✅ Все проверки и APK успешно завершены."
