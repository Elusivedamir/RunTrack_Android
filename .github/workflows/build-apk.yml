name: Build RunTrack Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare diagnostic logs
        run: mkdir -p ci-logs

      # -------------------------------------------------
      # 1. Основной Kotlin-код
      # -------------------------------------------------
      - name: Main Kotlin compile
        id: compile
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon --continue --console=plain \
            :app:compileDebugKotlin \
            2>&1 | tee ci-logs/01-main-kotlin-compile.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 2. Unit tests
      # -------------------------------------------------
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon --continue --console=plain \
            :app:testDebugUnitTest \
            2>&1 | tee ci-logs/02-unit-tests.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 3. Android tests compile
      # -------------------------------------------------
      - name: Compile Android tests
        id: android_tests
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon --continue --console=plain \
            :app:compileDebugAndroidTestKotlin \
            2>&1 | tee ci-logs/03-android-tests.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 4. FULL LINT
      # -------------------------------------------------
      - name: Android lint - FULL REPORT
        id: lint
        continue-on-error: true
        run: |
          set +e

          gradle --no-daemon --continue --console=plain \
            :app:lintDebug \
            2>&1 | tee ci-logs/04-lint-gradle.log

          CODE=${PIPESTATUS[0]}

          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"

          echo
          echo "============================================================"
          echo "FULL ANDROID LINT REPORT"
          echo "============================================================"

          if [ -f "$REPORT" ]; then
            cp "$REPORT" ci-logs/05-lint-full-report.txt
            cat "$REPORT"
          else
            echo "Lint text report was not generated."
          fi

          echo
          echo "Lint exit code: $CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 5. Всё равно пытаемся собрать APK,
      # даже если lint/tests уже красные
      # -------------------------------------------------
      - name: Build debug APK
        id: apk
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon --continue --console=plain \
            :app:assembleDebug \
            2>&1 | tee ci-logs/06-assemble-debug.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE"
          exit "$CODE"

      # -------------------------------------------------
      # 6. Реальный запуск APK на Android Emulator.
      # Ловит startup/runtime crashes, которые assembleDebug не видит.
      # -------------------------------------------------
      - name: Prepare Android AVD home
        id: avd_home
        continue-on-error: true
        run: |
          set -euo pipefail

          AVD_HOME="$HOME/.android/avd"

          mkdir -p "$AVD_HOME"

          chmod 700 "$HOME/.android"
          chmod 700 "$AVD_HOME"

          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"

          echo "============================================================"
          echo "ANDROID AVD HOME"
          echo "============================================================"
          echo "HOME=$HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME"

          test -d "$AVD_HOME"

          ls -ld "$HOME/.android"
          ls -ld "$AVD_HOME"
      - name: Enable KVM for Android Emulator
        id: kvm
        continue-on-error: true
        run: |
          set -e
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Runtime startup smoke test
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: runtrack-ci
          force-avd-creation: true
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -no-snapshot-save
          script: |
            set -euo pipefail

            APK="app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="com.runtrack.app"
            COMPONENT="com.runtrack.app/.MainActivity"

            test -f "$APK"

            adb wait-for-device
            adb logcat -c

            adb install -r "$APK"
            adb shell am force-stop "$PACKAGE"

            set +e
            START_OUTPUT="$(adb shell am start -W -n "$COMPONENT" 2>&1)"
            START_CODE=$?
            set -e

            {
              echo "============================================================"
              echo "RUNTRACK RUNTIME START"
              echo "============================================================"
              echo "$START_OUTPUT"
              echo
              echo "am start exit code: $START_CODE"
            } | tee ci-logs/07-runtime-start.txt

            sleep 12

            adb logcat -d -v threadtime > ci-logs/08-runtime-logcat.txt

            {
              echo
              echo "============================================================"
              echo "RUNTRACK PROCESS"
              echo "============================================================"
              adb shell pidof "$PACKAGE" || true

              echo
              echo "============================================================"
              echo "CURRENT FOCUS"
              echo "============================================================"

              adb shell dumpsys window windows \
                | grep -E 'mCurrentFocus|mFocusedApp' \
                || true
            } | tee ci-logs/09-runtime-state.txt

            if [ "$START_CODE" -ne 0 ]; then
              echo "❌ MainActivity launch command failed."
              exit 1
            fi

            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"

            if [ -z "$PID" ]; then
              echo "❌ RunTrack process is not alive after startup."
              exit 1
            fi

            if grep -E \
              'FATAL EXCEPTION|Process: com\.runtrack\.app|Unable to start activity|RuntimeException: Unable to' \
              ci-logs/08-runtime-logcat.txt; then
              echo "❌ Runtime crash detected in logcat."
              exit 1
            fi

            if grep -q 'CrashReportActivity' ci-logs/09-runtime-state.txt; then
              echo "❌ Built-in crash report screen became active."
              exit 1
            fi

            echo "✅ RunTrack survived startup smoke-test."
      # -------------------------------------------------
      # Краткая выборка всех Error/Exception
      # -------------------------------------------------
      - name: Collect error summary
        if: always()
        run: |
          {
            echo "============================================================"
            echo "RUNTRACK ERROR SUMMARY"
            echo "============================================================"
            echo

            grep -RniE \
              '(^|[[:space:]])(e:|error:|Error:|FAILURE:|Exception|Caused by:|FAILED)' \
              ci-logs \
              || true
          } | tee ci-logs/00-error-summary.txt

      # -------------------------------------------------
      # Все диагностические материалы сохраняются
      # даже при красной сборке
      # -------------------------------------------------
      - name: Upload full diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RunTrack-full-diagnostics
          path: |
            ci-logs/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      # Если APK реально построился — отдельный удобный artifact
      - name: Upload APK
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RunTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # -------------------------------------------------
      # Финальный статус. Только здесь CI окончательно падает.
      # -------------------------------------------------
      - name: Final CI gate
        if: always()
        run: |
          echo "========================================"
          echo "RUNTRACK FINAL STATUS"
          echo "========================================"
          echo "Main compile:   ${{ steps.compile.outcome }}"
          echo "Unit tests:     ${{ steps.unit.outcome }}"
          echo "Android tests:  ${{ steps.android_tests.outcome }}"
          echo "Lint:           ${{ steps.lint.outcome }}"
          echo "APK build:      ${{ steps.apk.outcome }}"
          echo "AVD home:       ${{ steps.avd_home.outcome }}"
          echo "KVM setup:      ${{ steps.kvm.outcome }}"
          echo "Runtime smoke:  ${{ steps.smoke.outcome }}"
          echo "========================================"

          FAILED=0

          [ "${{ steps.compile.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.unit.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.android_tests.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.lint.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.apk.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.avd_home.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.kvm.outcome }}" = "success" ] || FAILED=1
          [ "${{ steps.smoke.outcome }}" = "success" ] || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ Есть ошибки. Смотри RunTrack-full-diagnostics."
            exit 1
          fi

          echo "✅ Все проверки и APK успешно завершены."
